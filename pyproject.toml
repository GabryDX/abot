[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abot"
version = "0.8.0"
description = "Telegram (user)bot framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "alemi", email = "me@alemi.dev" },
    { name = "GabryDX", email = "gabrydx@hotmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "wzgram>=1.0.0",
    "setproctitle>=1.3.2",
    "termcolor>=2.1.1",
    "psutil>=5.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.urls]
Homepage = "https://git.alemi.dev/abot/core.git"
Repository = "https://github.com/GabryDX/abot.git"

[project.scripts]
abot = "abot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abot = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E501",  # line too long
    "W191",  # indentation contains tabs (project uses tabs as per .editorconfig)
    "E101",  # mixed spaces and tabs
    "E111",  # indentation is not a multiple of four
    "E114",  # indentation is not a multiple of four (comment)
    "E117",  # over-indented
    "E402",  # module level import not at top of file
    "E722",  # do not use bare except
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
