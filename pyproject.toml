[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abot"
version = "0.8.0"
description = "Telegram (user)bot framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "alemi", email = "me@alemi.dev" },
    { name = "GabryDX", email = "gabrydx@hotmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "pyrogram>=2.0.106",
    "setproctitle>=1.3.2",
    "termcolor>=2.1.1",
    "psutil>=5.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.urls]
Homepage = "https://git.alemi.dev/abot/core.git"
Repository = "https://github.com/GabryDX/abot.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abot = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "UP"]
ignore = ["E501"]
